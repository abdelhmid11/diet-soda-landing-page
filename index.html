const modelViewer=document.querySelector('#product-model'),berriesFG=document.querySelector('.berries-container'),berriesBG=document.querySelector('.berries-container-bg'),leavesBG=document.querySelector('.leaves-container'),allBerries=document.querySelectorAll('.berry'),cards=document.querySelectorAll('.card');let isSwitching=false,switchSpin=0,blueTexture=null,greenTexture=null;const BLUE='https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/blue%20base%20color.jpg',GREEN='https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/green%20base%20color.jpg',CHERRY='https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb',BLUEBERRY='https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/blueberry.glb';
modelViewer.addEventListener('load',async()=>{try{blueTexture=await modelViewer.createTexture(BLUE);greenTexture=await modelViewer.createTexture(GREEN);if(modelViewer.model){const m=modelViewer.model.materials[0];if(m&&m.pbrMetallicRoughness.baseColorTexture){m.pbrMetallicRoughness.baseColorTexture.setTexture(blueTexture);await new Promise(r=>requestAnimationFrame(r));m.pbrMetallicRoughness.baseColorTexture.setTexture(greenTexture)}}}catch(e){console.error('Texture preload failed',e)}});cards.forEach(card=>card.addEventListener('click',()=>{if(isSwitching)return;cards.forEach(c=>c.classList.remove('active'));card.classList.add('active');switchFlavor(card.dataset.flavor)}));
async function switchFlavor(flavor){if(isSwitching)return;isSwitching=true;const body=document.body,berries=document.querySelectorAll('.berry'),heroCenter=document.querySelector('.hero-center');const targetColors=flavor==='blue'?{inner:'#0b4f8a',mid:'#04294e',outer:'#010c14'}:{inner:'#0b8a78',mid:'#044e3b',outer:'#011411'};gsap.to(body,{'--bg-inner':targetColors.inner,'--bg-mid':targetColors.mid,'--bg-outer':targetColors.outer,duration:1.5,ease:'power2.inOut'});const spinObj={val:0,blur:0};gsap.to(spinObj,{val:360,blur:15,duration:.6,ease:'power2.in',onUpdate:()=>{switchSpin=spinObj.val;modelViewer.style.filter=`blur(${spinObj.blur}px)`},onComplete:async()=>{if(flavor==='blue'){body.classList.add('blue-theme');if(modelViewer.model&&blueTexture)modelViewer.model.materials.forEach(m=>{if(m.pbrMetallicRoughness.baseColorTexture)m.pbrMetallicRoughness.baseColorTexture.setTexture(blueTexture)})}else{body.classList.remove('blue-theme');if(modelViewer.model&&greenTexture)modelViewer.model.materials.forEach(m=>{if(m.pbrMetallicRoughness.baseColorTexture)m.pbrMetallicRoughness.baseColorTexture.setTexture(greenTexture)})}gsap.to(spinObj,{val:720,blur:0,duration:1.5,ease:'back.out(.7)',onUpdate:()=>{switchSpin=spinObj.val;modelViewer.style.filter=`blur(${spinObj.blur}px)`},onComplete:()=>{switchSpin=0;modelViewer.style.filter='none'}})}});let completedBerries=0;berries.forEach(berry=>{const bW=berry.offsetWidth/2,bH=berry.offsetHeight/2,centerX=innerWidth/2-berry.offsetLeft-bW,centerY=innerHeight/2-berry.offsetTop-bH,startAngle=parseFloat(berry.dataset.angle)||0,currentBaseX=parseFloat(berry.dataset.baseX)||0,currentBaseY=parseFloat(berry.dataset.baseY)||0,nextBaseX=(Math.random()-.5)*200,nextBaseY=(Math.random()-.5)*200;gsap.set(berry,{rotation:startAngle,x:currentBaseX,y:currentBaseY});gsap.timeline().to(berry,{x:centerX,y:centerY,rotation:startAngle+45,scale:.1,opacity:0,duration:.5,ease:'power2.in',onComplete:()=>{berry.src=flavor==='blue'?BLUEBERRY:CHERRY;heroCenter.style.zIndex=50}}).to(berry,{duration:.3}).to(berry,{onStart:()=>heroCenter.style.zIndex=1,x:nextBaseX,y:nextBaseY,rotation:startAngle+90,scale:1,opacity:1,duration:.9,ease:'back.out(1.5)',onComplete:()=>{berry.dataset.angle=startAngle+90;berry.dataset.baseX=nextBaseX;berry.dataset.baseY=nextBaseY;berry.dataset.rx=0;berry.dataset.ry=0;if(++completedBerries===berries.length)isSwitching=false}})})}
allBerries.forEach(b=>{b.dataset.rx=0;b.dataset.ry=0;b.dataset.angle=Math.random()*360;b.dataset.baseX=0;b.dataset.baseY=0});let mouse={x:0,y:0,px:0,py:0},currentMouse={x:0,y:0};addEventListener('mousemove',e=>{mouse.x=e.clientX/innerWidth-.5;mouse.y=e.clientY/innerHeight-.5;mouse.px=e.clientX;mouse.py=e.clientY});function animate(){const time=Date.now()*.001;currentMouse.x+=(mouse.x-currentMouse.x)*.05;currentMouse.y+=(mouse.y-currentMouse.y)*.05;modelViewer.cameraOrbit=`${currentMouse.x*40+switchSpin}deg ${90+currentMouse.y*20}deg 380%`;berriesFG.style.transform=`translate(${currentMouse.x*60}px,${currentMouse.y*60}px)`;berriesBG.style.transform=`translate(${currentMouse.x*-30}px,${currentMouse.y*-30}px)`;leavesBG.style.transform=`translate(${currentMouse.x*-15}px,${currentMouse.y*-15}px)`;if(!isSwitching)allBerries.forEach((berry,i)=>{const r=berry.getBoundingClientRect(),dx=mouse.px-r.left-r.width/2,dy=mouse.py-r.top-r.height/2,d=Math.sqrt(dx*dx+dy*dy);let tx=0,ty=0,s=1;if(d<400){const f=(400-d)/400;tx=dx/d*f*-80;ty=dy/d*f*-80;s=1+f*5}let x=parseFloat(berry.dataset.rx)||0,y=parseFloat(berry.dataset.ry)||0,a=parseFloat(berry.dataset.angle)||0,bx=parseFloat(berry.dataset.baseX)||0,by=parseFloat(berry.dataset.baseY)||0;x+=(tx-x)*.1;y+=(ty-y)*.1;a+=.2*s;berry.dataset.rx=x;berry.dataset.ry=y;berry.dataset.angle=a;const dur=[5,7,6,8,5.5,6.5,9,11,10][i%9],phase=(time+i*.7)*Math.PI*2/dur;berry.style.transform=`translate(${x+bx}px,${y+by+Math.sin(phase)*15}px) rotate(${a+Math.cos(phase)*6}deg)`});document.querySelectorAll('.leaf').forEach((leaf,i)=>{const p=(time+i*1.2)*Math.PI*2/(10+i);leaf.style.transform=`translate(${Math.cos(p*.5)*15}px,${Math.sin(p)*20}px) rotate(${Math.sin(p*.3)*15}deg)`});requestAnimationFrame(animate)}animate();const bubblesContainer=document.getElementById('bubbles-container');function createBubble(){const b=document.createElement('img');b.src='https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/bubble.png';b.classNam
